[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyopenms-mcp"
version = "0.1.0"
description = "MCP server that exposes pyOpenMS mass spectrometry functionality"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "pyopenms>=3.0.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "pandas>=2.0.0",
]

[project.scripts]
pyopenms-mcp = "pyopenms_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pyopenms_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
line-length = 100
src = ["src"]
